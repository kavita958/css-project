<!DOCTYPE html>
<html>
    <head>
        <title>glowing button</title>
        <style>
            body{background: #121111;
            display: flex;
        justify-content: center;
    align-items: center;
height: 100vh;
margin: 0;}
.btn{padding: 30px;
font-size: 25px;
color: #d1c9c9;
background: transparent;
border: 8px solid #07278f;
border-radius: 20px;
cursor: pointer;
transition: 0.3s;}
.btn:hover{background: #035a5a;
color: #e05757;
box-shadow: 0 0 10px #00ffff,0 0 60px #be51cf;}

        </style>
    </head>
    <body>
        <button class="btn">hover me</button>
    </body>
</html>
